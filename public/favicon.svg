<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lurvia-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BE9EC"/>
      <stop offset="100%" stop-color="#077DDC"/>
    </linearGradient>
  </defs>

  <!-- Rounded brand tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#lurvia-brand)"/>

  <!-- Letter L (geometric wedge). LURVIA wordmark opens with L — the favicon
       lifts that letter as the mark. -->
  <g fill="#ffffff">
    <path d="M22 16 L30 16 L30 40 L46 40 L46 48 L22 48 Z"/>
  </g>
</svg>
